aid: billtrim
name: BillTrim
description: >-
  BillTrim is a consumer bill-management and negotiation service that helps
  households lower, monitor, and pay their recurring bills. Its team negotiates
  with providers on the customer's behalf (up to twice a year), watches for
  price increases before autopay processes, and can pay bills automatically from
  a connected bank account. BillTrim advertises support for 20,000+ service
  providers across internet, cable, phone, insurance, and other recurring
  household expenses. Backed by 500 Global, it operates as a consumer-facing web
  and mobile application; no public developer API or developer portal is
  currently published.
